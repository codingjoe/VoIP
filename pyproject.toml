[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "voip"
readme = "README.md"
keywords = [ "asyncio", "RTP", "SIP", "STUN", "VoIP", "WebRTC" ]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  # https://pypi.org/classifiers/
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Communications :: Internet Phone",
  "Topic :: Communications :: Telephony",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]
dynamic = [ "description", "version" ]
dependencies = [ "cryptography" ]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.optional-dependencies]
ai = [ "av", "faster-whisper", "numpy", "ollama", "pocket-tts" ]
audio = [ "numpy" ]
cli = [ "click", "faster-whisper", "numpy", "ollama", "pocket-tts", "pygments" ]
hd-audio = [ "av", "numpy" ]
mcp = [ "av", "faster-whisper", "fastmcp>=3.2.4", "numpy", "ollama", "pocket-tts" ]
pygments = [ "pygments" ]
[project.urls]
Changelog = "https://github.com/codingjoe/VoIP/releases"
Documentation = "https://codingjoe.dev/VoIP/"
Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
Homepage = "https://github.com/codingjoe/VoIP"
Issues = "https://github.com/codingjoe/VoIP/issues"
Releasenotes = "https://github.com/codingjoe/VoIP/releases/latest"
Source = "https://github.com/codingjoe/VoIP"
[project.scripts]
voip = "voip.__main__:main"
[project.entry-points]
"pygments.lexers".sdp = "voip.sdp.lexers:SDPLexer"
"pygments.lexers".sip = "voip.sip.lexers:SIPLexer"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
]
test = [
  "pytest",
  "pytest-asyncio>=1.3",
  "pytest-cov",
]
docs = [
  "markdown-callouts",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]>=0.18",
  "pygments",
]

[tool.setuptools_scm]
write_to = "voip/_version.py"

[tool.flit]
[tool.flit.module]
name = "voip"

[tool.ruff]
src = [ "tests", "voip" ]
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."tests/**" = [ "DJ006", "DJ007", "DJ008", "PLR2004", "S101", "S105", "S106", "S311", "S603", "S607" ]
isort.combine-as-imports = true
isort.force-wrap-aliases = true
isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
isort.split-on-trailing-comma = true
pydocstyle.convention = "pep257"

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests" ]
addopts = "--cov --strict-markers --cov-report=xml --cov-report=term --doctest-modules"
markers = [
  "integration: marks tests as integration tests requiring network access (deselect with '-m \"not integration\"')",
]
asyncio_mode = "auto"

[tool.coverage]
[tool.coverage.run]
source = [ "voip" ]
[tool.coverage.report]
skip_covered = true
show_missing = true
