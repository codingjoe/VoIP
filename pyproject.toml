[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "voip"
readme = "README.md"
keywords = [ "asyncio", "RTP", "SIP", "STUN", "VoIP", "WebRTC" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  # https://pypi.org/classifiers/
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Communications :: Internet Phone",
  "Topic :: Communications :: Telephony",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Networking",
]
dynamic = [ "description", "version" ]
dependencies = [ "cryptography" ]
optional-dependencies.ai = [ "av", "faster-whisper", "numpy", "ollama", "pocket-tts" ]
optional-dependencies.audio = [ "numpy" ]
optional-dependencies.cli = [ "click", "faster-whisper", "numpy", "ollama", "pocket-tts", "pygments" ]
optional-dependencies.hd-audio = [ "av", "numpy" ]
optional-dependencies.mcp = [ "av", "faster-whisper", "fastmcp>=3.2.4", "numpy", "ollama", "pocket-tts" ]
optional-dependencies.pygments = [ "pygments" ]
urls.Changelog = "https://github.com/codingjoe/VoIP/releases"
urls.Documentation = "https://codingjoe.dev/VoIP/"
urls.Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
urls.Homepage = "https://github.com/codingjoe/VoIP"
urls.Issues = "https://github.com/codingjoe/VoIP/issues"
urls.Releasenotes = "https://github.com/codingjoe/VoIP/releases/latest"
urls.Source = "https://github.com/codingjoe/VoIP"
scripts.voip = "voip.__main__:main"
entry-points."pygments.lexers".sdp = "voip.sdp.lexers:SDPLexer"
entry-points."pygments.lexers".sip = "voip.sip.lexers:SIPLexer"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
]
test = [
  "pytest",
  "pytest-asyncio>=1.3",
  "pytest-cov",
]
docs = [
  "markdown-callouts",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]>=0.18",
  "pygments",
]

[tool.setuptools_scm]
write_to = "voip/_version.py"

[tool.flit]
module.name = "voip"

[tool.ruff]
src = [ "tests", "voip" ]
lint.select = [
  "B",  # flake8-bugbear
  "C",  # flake8-comprehensions
  "D",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "S",  # flake8-bandit
  "UP", # pyupgrade
  "W",  # pycodestyle warnings
]
lint.ignore = [ "B904", "D1", "E501", "S101" ]
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --strict-markers --cov-report=xml --cov-report=term --doctest-modules"
ini_options.markers = [
  "integration: marks tests as integration tests requiring network access (deselect with '-m \"not integration\"')",
]
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.source = [ "voip" ]
report.skip_covered = true
report.show_missing = true
